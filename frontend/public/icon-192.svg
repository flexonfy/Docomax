<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="docoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#docoBg)"/>
  
  <!-- Outer ring accent -->
  <circle cx="96" cy="96" r="96" fill="none" stroke="url(#docoAccent)" stroke-width="2" opacity="0.3"/>
  
  <!-- Central medical cross/plus -->
  <g transform="translate(96, 96)">
    <!-- Modern stethoscope inspired circle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Medical cross inside -->
    <rect x="-12" y="-20" width="24" height="40" fill="#ffffff" rx="3"/>
    <rect x="-20" y="-12" width="40" height="24" fill="#ffffff" rx="3"/>
    
    <!-- Pulse line accent -->
    <path d="M -28,-5 L -18,-5 L -14,-12 L -10,-2 L -6,-15 L -2,-5 L 2,-5 L 6,-12 L 10,-2 L 14,-15 L 18,-5 L 28,-5" 
          stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
